services:
  cfg1:
    image: mongodb/mongodb-community-server:latest
    container_name: cfg1
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27030:27017"
    volumes:
      - campus_cluster_cfg1_data:/data/db
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s1a:
    image: mongodb/mongodb-community-server:latest
    container_name: s1a
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27111:27017"]
    volumes: ["campus_cluster_s1a_data:/data/db"]
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s1b:
    image: mongodb/mongodb-community-server:latest
    container_name: s1b
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27112:27017"]
    volumes: ["campus_cluster_s1b_data:/data/db"]
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s1c:
    image: mongodb/mongodb-community-server:latest
    container_name: s1c
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27113:27017"]
    volumes: ["campus_cluster_s1c_data:/data/db"]
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s2a:
    image: mongodb/mongodb-community-server:latest
    container_name: s2a
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27121:27017"]
    volumes: ["campus_cluster_s2a_data:/data/db"]
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s2b:
    image: mongodb/mongodb-community-server:latest
    container_name: s2b
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27122:27017"]
    volumes: ["campus_cluster_s2b_data:/data/db"]
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s2c:
    image: mongodb/mongodb-community-server:latest
    container_name: s2c
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27123:27017"]
    volumes: ["campus_cluster_s2c_data:/data/db"]
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongos:
    image: mongodb/mongodb-community-server:latest
    container_name: mongos
    command: ["mongos", "--configdb", "configRS/cfg1:27017", "--bind_ip_all", "--port", "27017"]
    ports: ["127.0.0.1:27020:27017"]
    depends_on:
      cfg1: { condition: service_healthy }
      s1a: { condition: service_healthy }
      s1b: { condition: service_healthy }
      s1c: { condition: service_healthy }
      s2a: { condition: service_healthy }
      s2b: { condition: service_healthy }
      s2c: { condition: service_healthy }
    networks: [campus-cluster-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  cluster-init:
    image: mongodb/mongodb-community-server:latest
    container_name: cluster-init
    depends_on:
      cfg1: { condition: service_healthy }
      s1a: { condition: service_healthy }
      s1b: { condition: service_healthy }
      s1c: { condition: service_healthy }
      s2a: { condition: service_healthy }
      s2b: { condition: service_healthy }
      s2c: { condition: service_healthy }
    volumes:
      - ./init-cluster.sh:/init-cluster.sh:z
    networks: [campus-cluster-net]
    entrypoint: ["/bin/bash", "/init-cluster.sh"]
    restart: "no"

volumes:
  campus_cluster_cfg1_data:
  campus_cluster_s1a_data:
  campus_cluster_s1b_data:
  campus_cluster_s1c_data:
  campus_cluster_s2a_data:
  campus_cluster_s2b_data:
  campus_cluster_s2c_data:

networks:
  campus-cluster-net:
    name: campus-cluster-net
